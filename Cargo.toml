[package]
name = "raw_player"
version = "2026.2.0"
edition = "2024"
rust-version = "1.93"
description = "Raw audio/video player for Rust"
readme = "README.md"
homepage = "https://github.com/shiguredo/raw-player-rs"
repository = "https://github.com/shiguredo/raw-player-rs"
license = "Apache-2.0"
build = "build.rs"
include = ["/LICENSE", "/README.md", "/build.rs", "/src/**"]

# 以降は外部ライブラリビルド用のメタデータ
# (この内容は build.rs の中からのみ参照される)
[package.metadata.external-dependencies.sdl3]
url = "https://github.com/libsdl-org/SDL"
tag = "release-3.4.14"

[workspace]
members = ["pbt"]

# 依存を最小化する方針のため、ランタイム依存は持たない
[dependencies]

[dev-dependencies]
# examples/player でマイク入力に使う
shiguredo_audio_device = "2026.2"
# examples/player でカメラ入力に使う
shiguredo_video_device = "2026.2"

[build-dependencies]
# SDL3 ヘッダから Rust FFI バインディングを生成する
bindgen = "0.72"
# SDL3 を CMake でビルドする
shiguredo_cmake = "4.4"
# package.metadata.external-dependencies を読む
shiguredo_toml = "2026.2"

[features]
# SDL3 をソースからビルドする (CI・ローカル検証用。無効時は prebuilt を使う)
source-build = []
